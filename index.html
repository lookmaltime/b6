<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOCK6IX 주간계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">

<style>
/* ── 토큰: 라이트가 기본, 다크는 토큰만 재정의 ───────────────── */
:root{
  --bg:#F2F4F2;
  --paper:#FFFFFF;
  --paper-2:#EBEEEC;
  --ink:#14201E;
  --ink-2:#41524E;
  --muted:#6E807B;
  --line:#DCE2DF;
  --line-strong:#C4CEC9;
  --accent:#0E6F63;
  --accent-soft:#DCEDE9;
  --accent-ink:#08544A;
  --danger:#B3452F;
  --shadow:0 1px 2px rgba(20,32,30,.06), 0 8px 24px -18px rgba(20,32,30,.5);

  --c-class:#2F7DB5;
  --c-prac:#17868C;
  --c-work:#7A5AC4;
  --c-study:#5566C4;
  --c-body:#3A8A3E;
  --c-people:#BC4E76;
  --c-rest:#557687;
  --c-etc:#9A7B3D;
  --c-none:#94A29D;

  --fs-body:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513;
    --paper:#171F1D;
    --paper-2:#1E2725;
    --ink:#E7EDEA;
    --ink-2:#B6C3BE;
    --muted:#8B9A95;
    --line:#27332F;
    --line-strong:#35443F;
    --accent:#4FC9B4;
    --accent-soft:#12332E;
    --accent-ink:#8FE2D2;
    --danger:#E08268;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);

    --c-class:#6BAEE0;
    --c-prac:#4FBFC4;
    --c-work:#A98BEB;
    --c-study:#8B99EE;
    --c-body:#6FBE73;
    --c-people:#E8809F;
    --c-rest:#8CAEC0;
    --c-etc:#C9A867;
    --c-none:#7E8D88;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513;
  --paper:#171F1D;
  --paper-2:#1E2725;
  --ink:#E7EDEA;
  --ink-2:#B6C3BE;
  --muted:#8B9A95;
  --line:#27332F;
  --line-strong:#35443F;
  --accent:#4FC9B4;
  --accent-soft:#12332E;
  --accent-ink:#8FE2D2;
  --danger:#E08268;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.9);

  --c-class:#6BAEE0;
  --c-prac:#4FBFC4;
  --c-work:#A98BEB;
  --c-study:#8B99EE;
  --c-body:#6FBE73;
  --c-people:#E8809F;
  --c-rest:#8CAEC0;
  --c-etc:#C9A867;
  --c-none:#7E8D88;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans KR","Gothic A1",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:var(--fs-body);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}

.shell{max-width:1560px;margin:0 auto;padding:20px 24px 56px;}

/* ── 상단: 브랜드 + 주 이동 ─────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:9px;}
.brand .mark{
  font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:19px;
  letter-spacing:.02em;color:var(--accent);
}
.brand .mark b{color:var(--ink);font-weight:700;}
.brand h1{
  font-family:"Gothic A1",sans-serif;font-weight:800;font-size:19px;
  margin:0;letter-spacing:-.02em;
}

.weeknav{display:flex;align-items:center;gap:4px;margin-left:auto;}
.navbtn{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--ink-2);font-size:17px;line-height:1;border:1px solid transparent;
  transition:background .14s,border-color .14s;
}
.navbtn:hover{background:var(--paper);border-color:var(--line);}
.range{
  display:flex;flex-direction:column;align-items:center;
  min-width:190px;padding:0 6px;
}
.range .r-main{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.25;
}
.range .r-sub{font-size:11px;color:var(--muted);letter-spacing:.01em;}
.range.is-now .r-sub{color:var(--accent);font-weight:500;}

.tools{display:flex;gap:6px;align-items:center;}
.btn{
  border:1px solid var(--line-strong);background:var(--paper);
  padding:5px 11px;border-radius:99px;font-size:12.5px;color:var(--ink-2);
  transition:background .14s, border-color .14s, color .14s;
}
.btn:hover{background:var(--paper-2);color:var(--ink);border-color:var(--muted);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--paper);border-color:var(--line);}

/* ── 이번 주 한 줄 목표 ─────────────────────────────── */
.goalbar{
  display:flex;align-items:center;gap:16px;
  margin:16px 0 18px;padding:14px 18px 14px 20px;
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  border-left:4px solid var(--accent);
  border-radius:12px;
}
.goal-label{
  flex:none;display:flex;flex-direction:column;gap:1px;
  padding-right:16px;border-right:1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}
.goal-label .en{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  letter-spacing:.18em;color:color-mix(in srgb, var(--accent-ink) 65%, transparent);
}
.goal-label .ko{
  font-family:"Gothic A1",sans-serif;font-weight:700;font-size:13px;
  color:var(--accent-ink);white-space:nowrap;letter-spacing:-.01em;
}
.goal-input{
  flex:1;min-width:0;background:transparent;border:none;padding:2px 0;
  font-family:"Gothic A1",sans-serif;font-weight:700;font-size:19px;
  letter-spacing:-.02em;color:var(--ink);
}
.goal-input::placeholder{
  color:color-mix(in srgb, var(--accent-ink) 45%, transparent);
  font-weight:500;font-size:16px;
}
.goal-input:focus{outline:none;}
.goalbar:focus-within{border-color:var(--accent);}
.goal-meter{
  flex:none;display:flex;align-items:baseline;gap:4px;color:var(--accent-ink);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
}
.goal-meter b{font-size:19px;font-weight:600;}
.goal-meter span{font-size:11px;opacity:.7;}

.layout{display:grid;grid-template-columns:352px minmax(0,1fr);gap:22px;align-items:start;}
@media (max-width:1080px){ .layout{grid-template-columns:1fr;} }

/* ── 좌: 생각 쏟아내기 ─────────────────────────────── */
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);
}
.panel-head{padding:15px 16px 12px;border-bottom:1px solid var(--line);}
.panel-head h2{
  font-family:"Gothic A1",sans-serif;font-weight:800;font-size:15px;margin:0 0 3px;
  letter-spacing:-.01em;
}
.panel-head p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;}

.stats{
  display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--paper-2);
}
.stat{display:flex;align-items:baseline;gap:5px;}
.stat b{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
.stat span{font-size:11.5px;color:var(--muted);}

.dump{padding:8px 10px 12px;max-height:min(58vh,700px);overflow-y:auto;}
.dump.dragover{background:var(--accent-soft);}

.project{border-bottom:1px solid var(--line);padding:8px 6px 10px;}
.project:last-child{border-bottom:none;}
.proj-head{display:flex;align-items:center;gap:6px;}
.twist{
  width:20px;height:20px;flex:none;display:grid;place-items:center;
  color:var(--muted);font-size:10px;border-radius:5px;transition:transform .15s;
}
.twist:hover{background:var(--paper-2);color:var(--ink);}
.project.collapsed .twist{transform:rotate(-90deg);}
.proj-name{
  flex:1;min-width:0;background:transparent;border:none;padding:2px 2px;
  font-family:"Gothic A1",sans-serif;font-weight:700;font-size:14px;letter-spacing:-.01em;
}
.proj-name:focus{outline:none;background:var(--paper-2);border-radius:5px;}
/* 프로젝트 분류 — 여기서 고른 색이 배치된 블럭에 그대로 칠해진다 */
.proj-cat{
  --c:var(--c-none);
  flex:none;max-width:112px;appearance:none;-webkit-appearance:none;
  border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background-color:color-mix(in srgb, var(--c) 12%, var(--paper));
  border-radius:999px;padding:2px 18px 2px 8px;font-size:11px;font-weight:600;color:var(--c);
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 10px) 9px, calc(100% - 6px) 9px;
  background-size:4px 4px, 4px 4px;background-repeat:no-repeat;
  cursor:pointer;text-overflow:ellipsis;
}
.proj-cat:hover{background-color:color-mix(in srgb, var(--c) 20%, var(--paper));}
.proj-cat[data-cat="none"]{color:var(--muted);font-weight:500;}
.proj-count{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  flex:none;padding-right:2px;
}
.icon-btn{
  width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:6px;
  color:var(--muted);font-size:13px;line-height:1;opacity:0;
  transition:opacity .14s,background .14s,color .14s;
}
.proj-head:hover .icon-btn, .task:hover .icon-btn, .icon-btn:focus-visible{opacity:1;}
.icon-btn:hover{background:var(--paper-2);color:var(--danger);}

.tasks{list-style:none;margin:4px 0 0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:1px;}
.project.collapsed .tasks, .project.collapsed .addsub{display:none;}

.task{
  display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:8px;
  cursor:grab;position:relative;
}
.task:hover{background:var(--paper-2);}
.task.dragging{opacity:.4;}
.task.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
.task .grip{
  color:var(--line-strong);font-size:11px;letter-spacing:-1px;flex:none;width:9px;
  font-family:"IBM Plex Mono",monospace;
}
.task:hover .grip{color:var(--muted);}
.check{
  width:16px;height:16px;flex:none;border-radius:5px;border:1.5px solid var(--line-strong);
  background:var(--paper);display:grid;place-items:center;color:transparent;font-size:10px;
  transition:background .14s,border-color .14s,color .14s;
}
.check:hover{border-color:var(--accent);}
.task.done .check{background:var(--accent);border-color:var(--accent);color:var(--paper);}
:root[data-theme="dark"] .task.done .check{color:#0F1513;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .task.done .check{color:#0F1513;}
}
.task-text{
  flex:1;min-width:0;text-align:left;background:transparent;border:none;padding:1px 0;
  font-size:13.5px;color:var(--ink);cursor:inherit;
}
.task-text:focus{outline:none;}
.task.placed .task-text, .task.done .task-text{
  text-decoration:line-through;
  text-decoration-color:var(--muted);
  text-decoration-thickness:1.5px;
  color:var(--muted);
}
.task.placed:not(.done) .task-text{text-decoration-color:var(--accent);}
.where{flex:none;display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:98px;}
.where i{
  font-family:"IBM Plex Mono",monospace;font-style:normal;font-size:10px;font-weight:500;
  color:var(--accent-ink);background:var(--accent-soft);
  border-radius:4px;padding:1px 4px;letter-spacing:.02em;
}
.where i.other{color:var(--muted);background:var(--paper-2);}

.addsub, .addproj{
  margin-top:5px;font-size:12.5px;color:var(--muted);
  padding:3px 6px;border-radius:7px;text-align:left;
}
.addsub{margin-left:20px;}
.addsub:hover,.addproj:hover{background:var(--paper-2);color:var(--accent);}
.addproj{margin:2px 6px 8px;display:block;width:calc(100% - 12px);border:1px dashed var(--line-strong);padding:7px;text-align:center;}

.legend{padding:12px 16px 14px;border-top:1px solid var(--line);}
.legend h3{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;
}
.legend ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 12px;}
.legend li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);}
.legend em{width:9px;height:9px;border-radius:3px;background:var(--dot);display:block;}

/* ── 우: 주간 블럭 표 ──────────────────────────────── */
.gridwrap{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;
}
.grid-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px 12px;border-bottom:1px solid var(--line);
}
.grid-head h2{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:15px;margin:0;letter-spacing:-.01em;}
.hint{font-size:12px;color:var(--muted);margin:0;}
.hint b{color:var(--accent);font-weight:600;}

.scroller{overflow-x:auto;}
.grid{
  display:grid;
  grid-template-columns:78px repeat(7,minmax(136px,1fr));
  min-width:1030px;
}
.gh{
  padding:8px 8px 7px;text-align:center;border-bottom:1px solid var(--line-strong);
  border-left:1px solid var(--line);background:var(--paper-2);
}
.gh:first-child{border-left:none;}
.gh .d{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;letter-spacing:.06em;display:block;}
.gh .dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);display:block;font-variant-numeric:tabular-nums;}
.gh.sat .d{color:var(--c-class);}
.gh.sun .d{color:var(--c-people);}
.gh.today{background:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent);}
.gh.today .d, .gh.today .dt{color:var(--accent-ink);}
.gh.today .dt{font-weight:600;}

.rowlab{
  border-top:1px solid var(--line);
  padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--paper-2);
}
.rowlab .n{
  font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;line-height:1;
  color:var(--ink-2);
}
.rowlab .t{
  width:100%;text-align:center;background:transparent;border:none;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);padding:1px 0;
}
.rowlab .t:focus{outline:none;background:var(--paper);border-radius:5px;color:var(--ink);}

.cell{
  border-left:1px solid var(--line);border-top:1px solid var(--line);
  min-height:100px;padding:6px;display:flex;flex-direction:column;gap:5px;
  transition:background .12s, box-shadow .12s;
}
.cell.weekend{background:color-mix(in srgb, var(--paper-2) 45%, transparent);}
.cell.today{background:color-mix(in srgb, var(--accent) 5%, var(--paper));}
.cell.dragover{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);}
.cell.target{box-shadow:inset 0 0 0 1.5px var(--accent);}
/* 오전 / 오후 / 저녁 묶음 경계 */
.cell.gsep, .rowlab.gsep{border-top:1px solid var(--line-strong);}

.cell-add{
  flex:1;min-height:20px;border-radius:7px;display:grid;place-items:center;
  color:transparent;font-size:15px;line-height:1;transition:color .14s,background .14s;
}
.cell:hover .cell-add{color:var(--line-strong);}
.cell-add:hover{background:var(--paper-2);color:var(--accent);}
.cell.target .cell-add{color:var(--accent);}

/* 배치된 블럭 카드 */
.chip{
  --c:var(--c-none);
  border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background:color-mix(in srgb, var(--c) 12%, var(--paper));
  border-left:3px solid var(--c);
  border-radius:8px;padding:5px 6px 6px 8px;cursor:grab;
  display:flex;flex-direction:column;gap:3px;
}
.chip.dragging{opacity:.4;}
:is(.chip,.proj-cat)[data-cat="class"]{--c:var(--c-class);}
:is(.chip,.proj-cat)[data-cat="prac"]{--c:var(--c-prac);}
:is(.chip,.proj-cat)[data-cat="work"]{--c:var(--c-work);}
:is(.chip,.proj-cat)[data-cat="study"]{--c:var(--c-study);}
:is(.chip,.proj-cat)[data-cat="body"]{--c:var(--c-body);}
:is(.chip,.proj-cat)[data-cat="people"]{--c:var(--c-people);}
:is(.chip,.proj-cat)[data-cat="rest"]{--c:var(--c-rest);}
:is(.chip,.proj-cat)[data-cat="etc"]{--c:var(--c-etc);}
.chip-top{display:flex;align-items:flex-start;gap:4px;}
.chip-title{
  flex:1;min-width:0;background:transparent;border:none;padding:1px 2px;
  font-size:12.5px;font-weight:500;line-height:1.35;border-radius:5px;
}
.chip-title:focus{outline:none;background:var(--paper);box-shadow:0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent);}
.chip-title::placeholder{color:var(--muted);font-weight:400;}
.chip-x{
  flex:none;width:17px;height:17px;display:grid;place-items:center;border-radius:5px;
  color:var(--muted);font-size:13px;line-height:1;
}
.chip-x:hover{background:color-mix(in srgb, var(--c) 22%, transparent);color:var(--danger);}
.chip-proj{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px;
}

.footnote{margin-top:14px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7;}
.footnote kbd{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;border:1px solid var(--line-strong);
  border-radius:4px;padding:1px 4px;color:var(--ink-2);
}

/* ── 태블릿·좁은 노트북: 한 주가 스크롤 없이 들어오게 ─────── */
@media (min-width:601px) and (max-width:1280px){
  .shell{padding:18px 16px 48px;}
  .grid{min-width:756px;grid-template-columns:56px repeat(7,minmax(100px,1fr));}
  .cell{min-height:92px;padding:5px;}
  .rowlab{padding:8px 4px;}
  .rowlab .n{font-size:15px;}
  .chip{padding:5px 5px 6px 7px;}
  .chip-title{font-size:12px;}
  .chip-proj{font-size:9px;}
}

/* 아이패드 미니처럼 더 좁은 태블릿 */
@media (min-width:601px) and (max-width:800px){
  .shell{padding:16px 10px 48px;}
  .grid{min-width:700px;grid-template-columns:50px repeat(7,minmax(92px,1fr));}
  .chip-title{font-size:11.5px;}
  .rowlab .t{font-size:9.5px;}
}

/* ── 터치 기기: hover에만 나타나던 것들을 항상 보이게 ─────── */
@media (hover: none){
  .icon-btn{opacity:1;}
  .cell-add{color:var(--line-strong);}
  .check{width:20px;height:20px;font-size:12px;}
  .chip-x{width:24px;height:24px;font-size:15px;}
  .navbtn{width:36px;height:36px;}
  .proj-cat{padding-top:4px;padding-bottom:4px;}
}

/* ── 핸드폰: 하루씩 보기 ───────────────────────────── */
.pickbar{display:none;}

/* ── 요일 탭 (핸드폰 주간뷰 + 하루계획 탭 공용) ─────── */
.daytabs{
  display:none;gap:2px;padding:8px 8px 9px;
  border-bottom:1px solid var(--line);background:var(--paper-2);
}
.daytabs.show{display:flex;}
.daytab{
  flex:1;min-width:0;padding:6px 2px 5px;border-radius:9px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  border:1px solid transparent;
}
.daytab .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;line-height:1.2;}

.daytab.sun .n{color:var(--c-people);}
.daytab.today{background:var(--accent-soft);}

.daytab.on .n, .daytab.on .dt{color:var(--paper);}

/* ── 주간 / 하루 탭 ────────────────────────────────── */
.tabs{display:flex;gap:2px;background:var(--paper-2);padding:3px;border-radius:10px;}
.tab{
  padding:5px 14px;border-radius:8px;font-size:13px;color:var(--muted);

  transition:background .14s,color .14s;
}
.tab:hover{color:var(--ink);}
.tab.on{
  background:var(--paper);color:var(--ink);font-weight:700;
  box-shadow:0 1px 2px rgba(20,32,30,.09);
}

/* ── 하루 계획 표 ──────────────────────────────────── */
.dhead, .drow{
  display:grid;
  grid-template-columns:86px minmax(150px, 0.85fr) minmax(0, 1.45fr);
}
.dhead{background:var(--paper-2);border-bottom:1px solid var(--line-strong);}
.dhead span{
  padding:7px 10px;border-left:1px solid var(--line);

}

}

}

  padding:7px;display:flex;flex-direction:column;gap:5px;
  border-right:1px solid var(--line);
}
.dblock.dragover{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);}

.dt-row{display:flex;align-items:center;gap:7px;padding:2px 4px 2px 0;border-radius:7px;}

<script>
(function(){
  "use strict";

  const DAYS = ["월","화","수","목","금","토","일"];
  const CATS = [
    {id:"none",   name:"미지정"},
    {id:"class",  name:"수업"},
    {id:"prac",   name:"실습"},
    {id:"work",   name:"과제/프로젝트"},
    {id:"study",  name:"공부"},
    {id:"body",   name:"운동/건강"},
    {id:"people", name:"관계/약속"},
    {id:"rest",   name:"휴식/충전"},
    {id:"etc",    name:"그 외"}
  ];
  const CAT_IDS = CATS.map(c => c.id);
  const KEY = "block6ix-planner-v2";
  const OLD_KEY = "weekly-block-planner-v1";
  const DEFAULT_TIMES = ["오전","오전","오후","오후","저녁","저녁"];

  /* ── 날짜 ──────────────────────────────────── */
  function mondayOf(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function ymd(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function parseYmd(s){ const p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
  const md = d => String(d.getMonth()+1).padStart(2,"0") + "." + String(d.getDate()).padStart(2,"0");
  const thisMonday = () => mondayOf(new Date());

  /* 보고 있는 주(월요일). 저장하지 않으므로 열 때마다 오늘이 속한 주로 시작한다 */
  let cursor = ymd(thisMonday());

  /* 좁은 화면에서는 하루씩 본다 */
  const mq = window.matchMedia("(max-width: 600px)");
  const isNarrow = () => mq.matches;
  function defaultDay(){
    const t = new Date();
    return ymd(mondayOf(t)) === cursor ? ((t.getDay() + 6) % 7) : 0;
  }
  let dayCursor = defaultDay();
  let view = "week";   /* week = 주간 표, day = 하루 계획 */

  /* ── 상태 ──────────────────────────────────── */
  const seed = () => ({
    times: DEFAULT_TIMES.slice(),
    projects: [
      {id:"p1", name:"성인간호학 과제", cat:"work", collapsed:false, tasks:[
        {id:"t1", text:"자료 조사", done:false},
        {id:"t2", text:"초안 쓰기", done:false},
        {id:"t3", text:"수정·제출", done:false}
      ]},
      {id:"p2", name:"중간고사 준비", cat:"study", collapsed:false, tasks:[
        {id:"t4", text:"병태생리 요약본 만들기", done:false},
        {id:"t5", text:"약리 암기카드 1회독", done:false},
        {id:"t6", text:"기출문제 풀기", done:false}
      ]},
      {id:"p3", name:"실습 준비", cat:"prac", collapsed:false, tasks:[
        {id:"t7", text:"유니폼 세탁", done:false},
        {id:"t8", text:"케이스 스터디 정리", done:false}
      ]},
      {id:"p4", name:"나를 위한 시간", cat:"rest", collapsed:false, tasks:[
        {id:"t9", text:"헬스 3회 가기", done:false},
        {id:"t10", text:"엄마 생신 선물 고르기", done:false}
      ]}
    ],
    weeks: {}   // "YYYY-MM-DD"(월) -> { goal, cells: { "요일-블럭": [item] } }
  });

  let state = load() || seed();
  migrateCats(state);
  let seq = Date.now();
  const uid = p => p + (++seq).toString(36);
  let selected = null;   // 클릭 배치용으로 고른 taskId

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(!d || !Array.isArray(d.projects)) return null;
        d.weeks = d.weeks || {};
        if(!Array.isArray(d.times) || d.times.length !== 6) d.times = DEFAULT_TIMES.slice();
        return d;
      }
      /* 이전 버전(주 구분이 없던 형식) → 이번 주로 옮겨 담는다 */
      const old = localStorage.getItem(OLD_KEY);
      if(old){
        const o = JSON.parse(old);
        if(!o || !Array.isArray(o.projects)) return null;
        const OLD_TIMES = "아침,오전,점심,오후,저녁,밤";
        const w = {};
        w[cursor] = {goal: o.weeklabel || "", cells: o.cells || {}};
        return {
          times: (Array.isArray(o.times) && o.times.join(",") !== OLD_TIMES) ? o.times : DEFAULT_TIMES.slice(),
          projects: o.projects,
          weeks: w
        };
      }
      return null;
    }catch(e){ return null; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  /* 예전 카테고리(일·업무 등)를 지금 목록에 맞춰 옮긴다 */
  function migrateCats(d){
    const MAP = {job:"etc"};
    for(const wk in (d.weeks || {})){
      const c = (d.weeks[wk] && d.weeks[wk].cells) || {};
      for(const k in c) c[k].forEach(function(it){
        const v = MAP[it.cat] || it.cat;
        it.cat = CAT_IDS.indexOf(v) > -1 ? v : "none";
      });
    }
    /* 분류는 이제 프로젝트에 있다 — 예전에 블럭마다 고른 분류 중 가장 많이 쓴 것을 가져온다 */
    (d.projects || []).forEach(function(p){
      if(CAT_IDS.indexOf(p.cat) > -1) return;
      const ids = {}, tally = {};
      p.tasks.forEach(function(t){ ids[t.id] = 1; });
      for(const wk in (d.weeks || {})){
        const c = (d.weeks[wk] && d.weeks[wk].cells) || {};
        for(const k in c) c[k].forEach(function(it){
          if(ids[it.taskId] && it.cat && it.cat !== "none") tally[it.cat] = (tally[it.cat] || 0) + 1;
        });
      }
      let best = "none", n = 0;
      for(const k in tally) if(tally[k] > n){ best = k; n = tally[k]; }
      p.cat = best;
    });
  }

  function ensureWeek(k){
    if(!state.weeks[k]) state.weeks[k] = {goal:"", cells:{}, details:{}};
    if(!state.weeks[k].details) state.weeks[k].details = {};
    return state.weeks[k];
  }
  const cells = () => (state.weeks[cursor] ? state.weeks[cursor].cells : {});

  /* ── 조회 헬퍼 ─────────────────────────────── */
  function allTasks(){
    const out = [];
    state.projects.forEach(p => p.tasks.forEach(t => out.push({task:t, proj:p})));
    return out;
  }
  function findTask(id){
    for(const p of state.projects){
      const t = p.tasks.find(x => x.id === id);
      if(t) return {task:t, proj:p};
    }
    return null;
  }
  /* 세부 할 일 (하루계획 오른쪽 칸) — 주 데이터 안에 함께 저장 */
  const details = () => (state.weeks[cursor] && state.weeks[cursor].details) || {};
  const detailsOf = key => details()[key] || [];
  function pushDetail(key, item){
    const d = ensureWeek(cursor).details;
    (d[key] = d[key] || []).push(item);
  }
  function removeDetail(id){
    const d = details();
    for(const k in d){
      const i = d[k].findIndex(x => x.id === id);
      if(i > -1){ d[k].splice(i,1); if(!d[k].length) delete d[k]; return true; }
    }
    return false;
  }
  /* 블럭 카드든 세부 할 일이든 id 하나로 지운다 */
  function removeAnywhere(id){ removeItem(id); removeDetail(id); }

  /* 지금 보고 있는 주의 배치 — 블럭 카드 + 세부 할 일 둘 다 */
  function placementsOf(taskId){
    const out = [];
    const scan = (store, kind) => {
      for(const k in store){
        for(const it of store[k]){
          if(it.taskId !== taskId) continue;
          const p = k.split("-").map(Number);
          out.push({day:p[0], block:p[1], item:it, kind:kind});
        }
      }
    };
    scan(cells(), "block");
    scan(details(), "detail");
    out.sort((a,b) => a.day - b.day || a.block - b.block);
    return out;
  }
  /* 다른 주에 배치된 날짜 라벨 */
  function otherWeeksOf(taskId){
    const out = [];
    for(const wk in state.weeks){
      if(wk === cursor) continue;
      const stores = [state.weeks[wk].cells || {}, state.weeks[wk].details || {}];
      for(const c of stores){
        for(const k in c){
          for(const it of c[k]){
            if(it.taskId === taskId){
              const d = addDays(parseYmd(wk), Number(k.split("-")[0]));
              const lbl = (d.getMonth()+1) + "/" + d.getDate();
              if(out.indexOf(lbl) === -1) out.push(lbl);
            }
          }
        }
      }
    }
    return out;
  }
  function filledCount(){
    const c = cells();
    let n = 0;
    for(const k in c) if(c[k].length) n++;
    return n;
  }
  function removeItem(itemId){
    const c = cells();
    for(const k in c){
      const i = c[k].findIndex(x => x.id === itemId);
      if(i > -1){ c[k].splice(i,1); if(!c[k].length) delete c[k]; return; }
    }
  }
  function takeItem(itemId){
    const c = cells();
    for(const k in c){
      const i = c[k].findIndex(x => x.id === itemId);
      if(i > -1){
        const it = c[k].splice(i,1)[0];
        if(!c[k].length) delete c[k];
        return it;
      }
    }
    return null;
  }
  function push(key, item){
    const c = ensureWeek(cursor).cells;
    (c[key] = c[key] || []).push(item);
  }
  function place(taskId, key){
    push(key, {id:uid("i"), taskId:taskId, text:null});
  }

  /* ── 헤더: 날짜와 주 이동 ──────────────────── */
  function renderHeader(){
    const mon = parseYmd(cursor), sun = addDays(mon, 6);
    document.getElementById("r-main").textContent =
      mon.getFullYear() + ". " + md(mon) + " – " + md(sun);

    const diff = Math.round((mon - thisMonday()) / 604800000);
    const sub = diff === 0 ? "이번 주"
      : diff === -1 ? "지난주"
      : diff === 1 ? "다음 주"
      : diff < 0 ? (-diff) + "주 전"
      : diff + "주 뒤";
    document.getElementById("r-sub").textContent = sub;
    document.getElementById("range").classList.toggle("is-now", diff === 0);

    const g = document.getElementById("goal");
    const w = state.weeks[cursor];
    if(document.activeElement !== g) g.value = w ? (w.goal || "") : "";
    document.getElementById("m-filled").textContent = filledCount();
  }

  function goWeek(delta){
    cursor = ymd(addDays(parseYmd(cursor), delta * 7));
    selected = null; dayCursor = defaultDay(); setHint();
    render();
  }

  /* ── 좌측 목록 ─────────────────────────────── */
  const dump = document.getElementById("dump");

  function renderDump(){
    dump.textContent = "";
    state.projects.forEach(proj => {
      const box = el("div","project" + (proj.collapsed ? " collapsed" : ""));

      const head = el("div","proj-head");
      const tw = el("button","twist"); tw.textContent = "▼";
      tw.title = "접기/펼치기";
      tw.onclick = () => { proj.collapsed = !proj.collapsed; save(); renderDump(); };

      const nm = document.createElement("input");
      nm.className = "proj-name"; nm.value = proj.name;
      nm.placeholder = "프로젝트 이름";
      nm.setAttribute("aria-label","프로젝트 이름");
      nm.oninput = () => { proj.name = nm.value; save(); renderGrid(); };

      const cat = document.createElement("select");
      cat.className = "proj-cat";
      cat.dataset.cat = proj.cat || "none";
      cat.title = "분류 — 이 프로젝트의 블럭이 이 색으로 표시돼요";
      cat.setAttribute("aria-label","프로젝트 분류");
      CATS.forEach(c => {
        const o = document.createElement("option");
        o.value = c.id; o.textContent = c.id === "none" ? "분류 선택" : c.name;
        if((proj.cat || "none") === c.id) o.selected = true;
        cat.append(o);
      });
      cat.onchange = () => { proj.cat = cat.value; commit(); };

      const cnt = el("span","proj-count");
      cnt.textContent = proj.tasks.filter(t => t.done).length + "/" + proj.tasks.length;

      const del = el("button","icon-btn"); del.textContent = "✕";
      del.title = "프로젝트 삭제";
      del.onclick = () => {
        proj.tasks.forEach(t => placementsOf(t.id).forEach(p => removeItem(p.item.id)));
        state.projects = state.projects.filter(p => p !== proj);
        commit();
      };

      head.append(tw, nm, cat, cnt, del);
      box.append(head);

      const ul = el("ul","tasks");
      proj.tasks.forEach(t => ul.append(taskRow(t, proj)));
      box.append(ul);

      const add = el("button","addsub"); add.textContent = "+ 하위 항목";
      add.onclick = () => {
        proj.collapsed = false;
        const t = {id:uid("t"), text:"", done:false};
        proj.tasks.push(t);
        commit(); focusTask(t.id);
      };
      box.append(add);
      dump.append(box);
    });
    renderStats();
  }

  function taskRow(t, proj){
    const placed = placementsOf(t.id);
    const li = el("li","task" + (placed.length ? " placed" : "") + (t.done ? " done" : "") + (selected === t.id ? " selected" : ""));
    li.draggable = true;

    const grip = el("span","grip"); grip.textContent = "⠿";

    const ck = el("button","check"); ck.textContent = "✓";
    ck.title = t.done ? "완료 해제" : "완료 체크";
    ck.setAttribute("aria-pressed", String(t.done));
    ck.onclick = e => { e.stopPropagation(); t.done = !t.done; commit(); };

    const tx = document.createElement("input");
    tx.className = "task-text"; tx.value = t.text;
    tx.placeholder = "할 일을 적어보세요";
    tx.dataset.taskInput = t.id;
    tx.setAttribute("aria-label","할 일 이름");
    tx.oninput = () => { t.text = tx.value; save(); renderGrid(); };
    tx.onkeydown = e => {
      if(e.key === "Enter"){
        e.preventDefault();
        const nt = {id:uid("t"), text:"", done:false};
        proj.tasks.splice(proj.tasks.indexOf(t)+1, 0, nt);
        commit(); focusTask(nt.id);
      }
      if(e.key === "Backspace" && tx.value === "" && proj.tasks.length > 1){
        e.preventDefault();
        const i = proj.tasks.indexOf(t);
        placementsOf(t.id).forEach(p => removeAnywhere(p.item.id));
        proj.tasks.splice(i,1);
        commit();
        const prev = proj.tasks[i-1] || proj.tasks[0];
        if(prev) focusTask(prev.id, true);
      }
    };
    tx.onfocus = () => { li.draggable = false; };
    tx.onblur  = () => { li.draggable = true; };

    const where = el("span","where");
    const shown = {};
    placed.forEach(p => {
      const lbl = DAYS[p.day] + (p.block + 1);
      if(shown[lbl]) return;
      shown[lbl] = 1;
      const b = document.createElement("i");
      b.textContent = lbl;
      where.append(b);
    });
    otherWeeksOf(t.id).forEach(lbl => {
      const b = document.createElement("i");
      b.className = "other"; b.title = "다른 주에 배치됨";
      b.textContent = lbl;
      where.append(b);
    });

    const pick = el("button","icon-btn");
    pick.textContent = selected === t.id ? "◉" : "◎";
    pick.title = "클릭해서 배치할 항목으로 고르기";
    pick.onclick = e => { e.stopPropagation(); toggleSelect(t.id); };

    const del = el("button","icon-btn"); del.textContent = "✕";
    del.title = "항목 삭제";
    del.onclick = e => {
      e.stopPropagation();
      placementsOf(t.id).forEach(p => removeAnywhere(p.item.id));
      proj.tasks = proj.tasks.filter(x => x !== t);
      commit();
    };

    li.append(grip, ck, tx, where, pick, del);

    li.addEventListener("dragstart", e => {
      li.classList.add("dragging");
      e.dataTransfer.effectAllowed = "copyMove";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind:"task", id:t.id}));
      markTargets(true);
    });
    li.addEventListener("dragend", () => { li.classList.remove("dragging"); markTargets(false); });
    return li;
  }

  function focusTask(id, toEnd){
    requestAnimationFrame(() => {
      const inp = dump.querySelector('[data-task-input="' + id + '"]');
      if(inp){ inp.focus(); if(toEnd) inp.setSelectionRange(inp.value.length, inp.value.length); }
    });
  }

  function toggleSelect(id){
    selected = (selected === id) ? null : id;
    setHint(); renderDump(); renderGrid();
    if(selected && isNarrow()){
      document.querySelector(".gridwrap").scrollIntoView({behavior:"smooth", block:"start"});
    }
  }
  function setHint(){
    const h = document.getElementById("hint");
    if(selected){
      h.innerHTML = '고른 항목을 놓을 <b>칸을 클릭</b>하세요.';
    }else if(view === "day"){
      h.innerHTML = '왼쪽 항목을 <b>블럭</b>이나 <b>세부 할 일</b>로 끌어다 놓으세요.';
    }else{
      h.innerHTML = '왼쪽 항목을 <b>끌어다</b> 놓거나, 빈 칸을 <b>클릭</b>해 바로 쓰세요.';
    }
  }

  function renderStats(){
    const list = allTasks();
    document.getElementById("s-total").textContent = list.length;
    document.getElementById("s-placed").textContent = list.filter(x => placementsOf(x.task.id).length).length;
    document.getElementById("s-done").textContent = list.filter(x => x.task.done).length;
  }

  /* ── 주간 표 ───────────────────────────────── */
  const grid = document.getElementById("grid");

  function renderGrid(){
    grid.textContent = "";
    const mon = parseYmd(cursor);
    const todayKey = ymd(new Date());
    const isToday = [];
    for(let i=0; i<7; i++) isToday.push(ymd(addDays(mon, i)) === todayKey);

    if(isNarrow()) renderOneDay(mon, isToday);
    else renderWholeWeek(mon, isToday);

    document.getElementById("m-filled").textContent = filledCount();
    renderPickbar();
  }

  function rowLabEl(b){
    const lab = el("div","rowlab" + (b===2 || b===4 ? " gsep" : ""));
    const n = el("span","n"); n.textContent = b+1;
    const t = document.createElement("input");
    t.className = "t"; t.value = state.times[b] || "";
    t.placeholder = "시간";
    t.setAttribute("aria-label", (b+1) + "블럭 시간대");
    t.oninput = () => { state.times[b] = t.value; save(); };
    lab.append(n, t);
    return lab;
  }

  /* 핸드폰: 요일 탭 + 그날의 1~6블럭 */
  function renderOneDay(mon, isToday){
    renderDayTabs(mon, isToday);
    if(dayCursor < 0 || dayCursor > 6) dayCursor = 0;
    for(let b=0; b<6; b++){
      grid.append(rowLabEl(b));
      grid.append(cellEl(dayCursor, b, isToday[dayCursor]));
    }
  }

  function renderDayTabs(mon, isToday){
    const box = document.getElementById("daytabs");
    box.textContent = "";
    box.classList.add("show");
    const cMap = cells(), dMap = details();
    DAYS.forEach((name, i) => {
      let has = false;
      for(let b=0; b<6; b++){
        if((cMap[i + "-" + b] || []).length || (dMap[i + "-" + b] || []).length){ has = true; break; }
      }
      const date = addDays(mon, i);
      const t = el("button","daytab"
        + (isToday[i] ? " today" : "")
        + (i===5 ? " sat" : i===6 ? " sun" : "")
        + (has ? " has" : "")
        + (i===dayCursor ? " on" : ""));
      t.setAttribute("role","tab");
      t.setAttribute("aria-selected", String(i === dayCursor));
      const n = el("span","n"); n.textContent = name;
      const dt = el("span","dt"); dt.textContent = (date.getMonth()+1) + "/" + date.getDate();
      const dot = el("span","dot");
      t.append(n, dt, dot);
      t.onclick = () => { dayCursor = i; if(view === "day") renderDaily(); else renderGrid(); };
      box.append(t);
    });
  }

  /* 고른 항목을 알려주는 하단 안내 바(좁은 화면 전용) */
  function renderPickbar(){
    const bar = document.getElementById("pickbar");
    const on = !!selected && isNarrow();
    bar.classList.toggle("on", on);
    if(on){
      const f = findTask(selected);
      const name = (f && f.task.text.trim()) || "이름 없는 항목";
      document.getElementById("pickbar-t").textContent = "「" + name + "」 놓을 블럭을 누르세요";
    }
  }

  /* PC: 한 주 전체 */
  function renderWholeWeek(mon, isToday){
    const tabs = document.getElementById("daytabs");
    tabs.textContent = "";
    tabs.classList.remove("show");

    const corner = el("div","gh");
    const cl = el("span","d");
    cl.textContent = "BLOCK";
    cl.style.fontSize = "9.5px"; cl.style.color = "var(--muted)";
    corner.append(cl);
    grid.append(corner);

    DAYS.forEach((name, i) => {
      const date = addDays(mon, i);
      const h = el("div","gh" + (i===5 ? " sat" : i===6 ? " sun" : "") + (isToday[i] ? " today" : ""));
      const d = el("span","d"); d.textContent = name;
      const dt = el("span","dt"); dt.textContent = (date.getMonth()+1) + "/" + date.getDate();
      h.append(d, dt);
      grid.append(h);
    });

    for(let b=0; b<6; b++){
      grid.append(rowLabEl(b));
      for(let d=0; d<7; d++) grid.append(cellEl(d, b, isToday[d]));
    }
  }

  function cellEl(d, b, today, mode){
    const key = d + "-" + b;
    const c = mode === "day"
      ? el("div","dblock" + (selected ? " target" : ""))
      : el("div","cell"
          + (d>=5 ? " weekend" : "") + (today ? " today" : "")
          + (b===2 || b===4 ? " gsep" : "") + (selected ? " target" : ""));
    c.dataset.key = key;
    c.setAttribute("role","group");
    c.setAttribute("aria-label", DAYS[d] + "요일 " + (b+1) + "블럭");

    (cells()[key] || []).forEach(item => c.append(chipEl(item)));

    const add = el("button","cell-add");
    add.textContent = "+";
    add.title = selected ? "고른 항목 놓기" : "여기에 바로 쓰기";
    add.setAttribute("aria-label", DAYS[d] + "요일 " + (b+1) + "블럭에 바로 쓰기");
    add.onclick = e => {
      e.stopPropagation();
      if(selected){ place(selected, key); selected = null; setHint(); commit(); return; }
      const item = {id:uid("i"), taskId:null, text:"", cat:"none"};
      push(key, item);
      commit(); focusChip(item.id);
    };
    c.append(add);

    c.addEventListener("dragover", e => {
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      c.classList.add("dragover");
    });
    c.addEventListener("dragleave", () => c.classList.remove("dragover"));
    c.addEventListener("drop", e => {
      e.preventDefault();
      c.classList.remove("dragover");
      let data;
      try{ data = JSON.parse(e.dataTransfer.getData("text/plain")); }catch(err){ return; }
      if(!data) return;
      if(data.kind === "task"){ place(data.id, key); }
      else if(data.kind === "item"){
        const moved = takeItem(data.id);
        if(moved) push(key, moved);
      }
      commit();
    });
    c.addEventListener("click", e => {
      if(!selected || e.target.closest(".chip")) return;
      place(selected, key);
      selected = null; setHint();
      commit();
    });
    return c;
  }

  function focusChip(itemId){
    requestAnimationFrame(() => {
      const inp = grid.querySelector('[data-chip-input="' + itemId + '"]');
      if(inp) inp.focus();
    });
  }

  function chipEl(item){
    const linked = item.taskId ? findTask(item.taskId) : null;
    if(item.taskId && !linked){ removeItem(item.id); return document.createDocumentFragment(); }

    const chip = el("div","chip");
    chip.dataset.cat = linked ? (linked.proj.cat || "none") : (item.cat || "none");
    chip.draggable = true;

    const top = el("div","chip-top");
    const title = document.createElement("input");
    title.className = "chip-title";
    title.dataset.chipInput = item.id;
    title.value = linked ? linked.task.text : (item.text || "");
    title.placeholder = "무엇을 할까요?";
    title.setAttribute("aria-label","블럭 내용");
    title.oninput = () => {
      if(linked){ linked.task.text = title.value; save(); renderDump(); }
      else { item.text = title.value; save(); }
    };
    title.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); title.blur(); } };
    title.onfocus = () => { chip.draggable = false; };
    title.onblur = () => {
      chip.draggable = true;
      if(!linked && !title.value.trim()){ removeItem(item.id); commit(); }  // 빈 블럭은 정리
    };

    const x = el("button","chip-x"); x.textContent = "✕";
    x.title = linked ? "블럭에서 빼기" : "블럭 지우기";
    x.onclick = e => { e.stopPropagation(); removeItem(item.id); commit(); };
    top.append(title, x);

    const pj = el("div","chip-proj");
    pj.textContent = linked ? (linked.proj.name || "프로젝트") : "직접 입력";

    /* 버튼을 누르는 동안에는 드래그가 가로채지 않도록 */
    [x].forEach(node => {
      node.addEventListener("pointerdown", () => { chip.draggable = false; });
      node.addEventListener("pointerup", () => { setTimeout(function(){ chip.draggable = true; }, 0); });
      node.addEventListener("blur", () => { chip.draggable = true; });
    });

    chip.append(top, pj);

    chip.addEventListener("dragstart", e => {
      chip.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind:"item", id:item.id}));
      markTargets(true);
    });
    chip.addEventListener("dragend", () => { chip.classList.remove("dragging"); markTargets(false); });
    return chip;
  }

  /* ── 하루 계획 ─────────────────────────────── */
  const daily = document.getElementById("daily");

  function renderDaily(){
    const mon = parseYmd(cursor);
    const todayKey = ymd(new Date());
    const isToday = [];
    for(let i=0; i<7; i++) isToday.push(ymd(addDays(mon, i)) === todayKey);
    if(dayCursor < 0 || dayCursor > 6) dayCursor = 0;
    renderDayTabs(mon, isToday);

    daily.textContent = "";
    const head = el("div","dhead");
    ["BLOCK", "블럭 — 주간계획과 연동", "세부 할 일"].forEach(t => {
      const sp = document.createElement("span");
      sp.textContent = t;
      head.append(sp);
    });
    daily.append(head);

    for(let b=0; b<6; b++){
      const row = el("div","drow" + (b===2 || b===4 ? " gsep" : ""));
      const num = el("div","dnum");
      const n = el("span","n"); n.textContent = b+1;
      const t = document.createElement("input");
      t.className = "t"; t.value = state.times[b] || "";
      t.placeholder = "시간";
      t.setAttribute("aria-label", (b+1) + "블럭 시간대");
      t.oninput = () => { state.times[b] = t.value; save(); };
      num.append(n, t);
      row.append(num, cellEl(dayCursor, b, isToday[dayCursor], "day"), detailBox(b));
      daily.append(row);
    }
    document.getElementById("m-filled").textContent = filledCount();
    renderPickbar();
  }

  function detailBox(b){
    const key = dayCursor + "-" + b;
    const box = el("div","ddetail");
    detailsOf(key).forEach(item => box.append(detailRow(item, key)));

    const add = el("button","dadd");
    add.textContent = "+ 세부 할 일";
    add.onclick = () => {
      const item = {id:uid("s"), taskId:null, text:"", done:false, star:false};
      pushDetail(key, item);
      commit(); focusDetail(item.id);
    };
    box.append(add);

    box.addEventListener("dragover", e => {
      e.preventDefault(); e.dataTransfer.dropEffect = "copy";
      box.classList.add("dragover");
    });
    box.addEventListener("dragleave", () => box.classList.remove("dragover"));
    box.addEventListener("drop", e => {
      box.classList.remove("dragover");
      let data; try{ data = JSON.parse(e.dataTransfer.getData("text/plain")); }catch(err){ return; }
      if(!data) return;
      e.preventDefault();
      if(data.kind === "task"){
        pushDetail(key, {id:uid("s"), taskId:data.id, text:null, done:false, star:false});
      }else if(data.kind === "item"){
        /* 블럭 카드를 세부 할 일로 내린다 */
        const moved = takeItem(data.id);
        if(moved) pushDetail(key, {id:uid("s"), taskId:moved.taskId, text:moved.text, done:false, star:false});
      }
      commit();
    });
    box.addEventListener("click", e => {
      if(!selected || e.target.closest(".dt-row") || e.target.closest(".dadd")) return;
      pushDetail(key, {id:uid("s"), taskId:selected, text:null, done:false, star:false});
      selected = null; setHint(); commit();
    });
    return box;
  }

  function detailRow(item, key){
    const linked = item.taskId ? findTask(item.taskId) : null;
    if(item.taskId && !linked){ removeDetail(item.id); return document.createDocumentFragment(); }

    const row = el("div","dt-row" + (item.done ? " done" : "") + (item.star ? " star" : ""));

    const dash = el("button","dt-dash");
    dash.textContent = item.done ? "✓" : "–";
    dash.title = item.done ? "완료 해제" : "완료 표시";
    dash.setAttribute("aria-pressed", String(!!item.done));
    dash.onclick = () => { item.done = !item.done; commit(); };

    const tx = document.createElement("input");
    tx.className = "dt-text";
    tx.dataset.detailInput = item.id;
    tx.value = linked ? linked.task.text : (item.text || "");
    tx.placeholder = "무엇을 할까요?";
    tx.setAttribute("aria-label","세부 할 일");
    tx.oninput = () => {
      if(linked){ linked.task.text = tx.value; save(); renderDump(); }
      else { item.text = tx.value; save(); }
    };
    tx.onkeydown = e => {
      if(e.key === "Enter"){
        e.preventDefault();
        const list = detailsOf(key);
        const nt = {id:uid("s"), taskId:null, text:"", done:false, star:false};
        list.splice(list.indexOf(item) + 1, 0, nt);
        commit(); focusDetail(nt.id);
      }
    };
    tx.onblur = () => { if(!linked && !tx.value.trim()){ removeDetail(item.id); commit(); } };

    const star = el("button","dt-star");
    star.textContent = "★";
    star.title = "강조";
    star.onclick = () => { item.star = !item.star; commit(); };

    const x = el("button","dt-x");
    x.textContent = "✕";
    x.title = "지우기";
    x.onclick = () => { removeDetail(item.id); commit(); };

    row.append(dash, tx);
    if(linked){
      const lk = el("span","dt-link");
      lk.textContent = linked.proj.name || "프로젝트";
      lk.title = "쏟아내기에서 가져온 항목";
      row.append(lk);
    }
    row.append(star, x);
    return row;
  }

  function focusDetail(id){
    requestAnimationFrame(() => {
      const inp = daily.querySelector('[data-detail-input="' + id + '"]');
      if(inp) inp.focus();
    });
  }

  function renderTabs(){
    document.getElementById("tab-week").classList.toggle("on", view === "week");
    document.getElementById("tab-day").classList.toggle("on", view === "day");
    document.getElementById("tab-week").setAttribute("aria-selected", String(view === "week"));
    document.getElementById("tab-day").setAttribute("aria-selected", String(view === "day"));
  }

  function markTargets(on){
    document.querySelectorAll(".cell, .dblock, .ddetail")
      .forEach(c => c.classList.toggle("target", on || !!selected));
  }

  /* 왼쪽 패널로 되돌려 놓기 = 배치 취소 */
  dump.addEventListener("dragover", e => {
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    dump.classList.add("dragover");
  });
  dump.addEventListener("dragleave", () => dump.classList.remove("dragover"));
  dump.addEventListener("drop", e => {
    dump.classList.remove("dragover");
    let data; try{ data = JSON.parse(e.dataTransfer.getData("text/plain")); }catch(err){ return; }
    if(data && data.kind === "item"){ e.preventDefault(); removeItem(data.id); commit(); }
  });

  /* ── 범례 ──────────────────────────────────── */
  function renderLegend(){
    const ul = document.getElementById("legend");
    ul.textContent = "";
    CATS.filter(c => c.id !== "none").forEach(c => {
      const li = document.createElement("li");
      const em = document.createElement("em");
      em.style.setProperty("--dot", "var(--c-" + c.id + ")");
      li.append(em, document.createTextNode(c.name));
      ul.append(li);
    });
  }

  /* ── 공통 ──────────────────────────────────── */
  function el(tag, cls){ const n = document.createElement(tag); if(cls) n.className = cls; return n; }
  function render(){
    renderHeader(); renderTabs(); renderDump();
    const scroller = document.getElementById("scroller");
    if(view === "day"){
      scroller.hidden = true; daily.hidden = false;
      grid.textContent = "";
      renderDaily();
    }else{
      daily.hidden = true; scroller.hidden = false;
      daily.textContent = "";
      renderGrid();
    }
  }
  function commit(){ save(); render(); }

  const goal = document.getElementById("goal");
  goal.oninput = () => { ensureWeek(cursor).goal = goal.value; save(); };

  function setView(v){
    if(view === v) return;
    view = v; selected = null;
    if(v === "day") dayCursor = defaultDay();
    setHint(); render();
  }
  document.getElementById("tab-week").onclick = () => setView("week");
  document.getElementById("tab-day").onclick = () => setView("day");

  document.getElementById("prev").onclick = () => goWeek(-1);
  document.getElementById("next").onclick = () => goWeek(1);
  document.getElementById("today").onclick = () => {
    cursor = ymd(thisMonday()); selected = null; dayCursor = defaultDay(); setHint(); render();
  };
  document.getElementById("pickbar-x").onclick = () => { selected = null; setHint(); render(); };
  /* 화면 폭이 주간 <-> 하루 경계를 넘으면 다시 그린다 (회전·창 크기 변경) */
  let wasNarrow = isNarrow(), resizeTimer = null;
  function onViewportChange(){
    if(isNarrow() === wasNarrow) return;
    wasNarrow = isNarrow();
    if(view === "week") dayCursor = defaultDay();
    render();
  }
  mq.addEventListener("change", onViewportChange);
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(onViewportChange, 150);
  });
  document.getElementById("add-project").onclick = () => {
    state.projects.push({id:uid("p"), name:"", cat:"none", collapsed:false, tasks:[{id:uid("t"), text:"", done:false}]});
    commit();
    requestAnimationFrame(() => {
      const inputs = dump.querySelectorAll(".proj-name");
      if(inputs.length) inputs[inputs.length-1].focus();
    });
  };
  document.getElementById("btn-clear-grid").onclick = () => {
    if(state.weeks[cursor]){ state.weeks[cursor].cells = {}; state.weeks[cursor].details = {}; }
    selected = null; commit();
  };
  document.getElementById("btn-reset").onclick = () => {
    state = seed(); cursor = ymd(thisMonday()); selected = null;
    goal.value = ""; commit();
  };
  document.addEventListener("keydown", e => {
    if(e.key === "Escape" && selected){ selected = null; setHint(); commit(); }
  });

  renderLegend();
  setHint();
  render();
})();
</script>
